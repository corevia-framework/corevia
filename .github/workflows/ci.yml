name: Corevia tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
      - run: php -n tests/v2/kernel.php
      - run: php -n tests/v2/flows.php
      - run: php -n tests/v3/composition.php
      - run: php -n tests/v3/scopes.php
      - run: php -n tests/v3/units.php
      - run: php -n tests/v3/artifact-boot.php
      - run: php -n tests/v3/contracts.php
      - run: php -n tests/v3/profiles.php
      - run: node tests/v3/profiles.mjs
      - run: npm ci --ignore-scripts
        working-directory: tools
      - run: python tools/architecture.py
      - run: python tests/v3/architecture.py
      - run: php corevia contract:compile contracts/example.json --output=contracts/generated --check
      - run: node tests/v3/contracts.mjs
      - run: python tests/v3/contracts.py
      - run: npm exec --yes --package=typescript@7.0.2 -- tsc tests/v3/contracts.types.mts --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022
      - run: php tests/features/databases.php
      - run: php -n tests/features/databases.php
      - run: php -n tests/features/web.php
      - run: php -n examples/v2/kernel.php
      - run: php -n test-project/tests/run.php
      - run: php test-project/tests/pdo.php
      - run: node test-project/tests/http.mjs
      - run: node tests/features/web.mjs
      - run: node tests/v2/realtime.mjs
      - run: node tests/v2/contracts.mjs
        env:
          PYTHON: python
      - run: node --test sdk/js/test/*.test.js
      - run: python -m unittest discover -s sdk/python/tests -v
        env:
          PYTHONPATH: sdk/python
      - run: node tests/integration.mjs
        env:
          PYTHON: python
      - run: python tests/v2/install.py
      - run: python tests/v2/history.py
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart analyze
        working-directory: sdk/dart
      - run: dart analyze contracts/generated/dart
      - run: dart run tests/v3/contracts.dart
      - run: dart run test/contracts.dart
        working-directory: sdk/dart
      - run: dart run test/io.dart
        working-directory: sdk/dart
  databases:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: corevia_ci
          MYSQL_USER: corevia
          MYSQL_PASSWORD: ci-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=15
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corevia_ci
          POSTGRES_USER: corevia
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U corevia -d corevia_ci"
          --health-interval=10s --health-timeout=5s --health-retries=15
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, mongodb
          coverage: none
      - run: php tests/features/databases.php
        env:
          COREVIA_DB_TESTS: '1'
