# TLS terminates at a separately configured, HTTPS-only trusted edge.
# Bind an origin to private networking/firewall; do not expose plaintext publicly.
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /srv/corevia/current/public;
    index index.php;
    client_max_body_size 64k;
    access_log off;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/corevia.sock;
        fastcgi_buffering off;
        fastcgi_read_timeout 60s;
    }
    location ~* \.php { return 404; }
    location ~ /\. { return 404; }
}
