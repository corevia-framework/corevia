; Example dedicated pool; verify PHP version, socket parent and service ownership.
[corevia]
user = corevia
group = corevia
listen = /run/php/corevia.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
request_terminate_timeout = 65s
clear_env = yes
; Explicitly allow required private environment values or configure a reviewed
; environment loader. Do not paste credentials into a world-readable pool file.
env[APP_ENV] = production
env[APP_HTTPS] = true
env[COREVIA_STORAGE] = /srv/corevia/shared/storage
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/corevia/shared/storage/php-error.log
