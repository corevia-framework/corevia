# Place behind the deployment's HTTPS edge proxy. Do not expose FPM publicly.
server {
    listen 80;
    server_name _;
    root /srv/corevia/public;
    client_max_body_size 64k;
    # Avoid storing OAuth codes/state in access-log query strings.
    access_log off;
    location / { try_files $uri /index.php$is_args$args; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/corevia/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass app:9000;
        fastcgi_buffering off;
        fastcgi_read_timeout 120s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
